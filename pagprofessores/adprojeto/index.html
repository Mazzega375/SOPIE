<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPIE - Adicionar Projeto</title>
    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <a href="../../pagprofessores/index.html" class="btn-voltar">← Voltar</a>

    <h1>Adicionar Projeto</h1>
    <br>

    <div class="campo">
        <label for="nomprojeto"></label>
        <input type="text" id="nomprojeto" placeholder="Nome do Projeto">
    </div>

    <div class="campo">
        <label for="lidergrupo"></label>
        <input type="text" id="lidergrupo" placeholder="Líder do Grupo">
    </div>

    <div class="campo">
        <label for="grupo"></label>
        <input type="text" id="grupo" placeholder="Grupo">
    </div>

    <div class="campo">
        <label for="orientador"></label>
        <input type="text" id="orientador" placeholder="Orientador">
    </div>

    <div class="campo" style="margin-top: 12px;">
        <textarea id="descproj" placeholder="Descrição do projeto"></textarea>
    </div>


    <div class="campo">
        <label>Professores</label>
        <div id="select-custom" onclick="abrirDropdown()"
            style="border: 1px solid rgba(148,163,184,0.25); border-radius: 14px; background:#fff; padding: 14px 16px; cursor:pointer; font-size:1rem; color:#9ca3af; display:flex; justify-content:space-between; align-items:center;">
            Selecione... <span>▾</span>
        </div>
        <div id="lista-dropdown"
            style="display:none; border: 1px solid rgba(148,163,184,0.25); border-radius: 14px; background:#fff; margin-top:4px; overflow:hidden;">
            <div style="padding: 8px; border-bottom: 1px solid rgba(148,163,184,0.15);">
                <input type="text" id="busca-professor" placeholder=" Pesquisar professor..."
                    oninput="filtrarProfessores()" autocomplete="off"
                    style="width:100%; border:1px solid rgba(148,163,184,0.25); border-radius:10px; padding:10px 12px; font-size:1rem;">
            </div>
            <div id="itens-dropdown" style="max-height:200px; overflow-y:auto;"></div>
        </div>
        <input type="hidden" id="professores">
    </div>

    <br>
    <button type="button" onclick="criarprojeto()">Criar Projeto</button>

    <script src="../../script.js"></script>
</body>

</html>
