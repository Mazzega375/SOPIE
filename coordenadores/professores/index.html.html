<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPIE - Professores</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .form-cadastro {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px 24px;
            margin-bottom: 32px;
            max-width: 480px;
        }
        .form-cadastro h2 {
            margin: 0 0 16px;
            font-size: 17px;
            color: #333;
        }
        .form-cadastro input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 8px 12px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-cadastro button {
            background: #2c7be5;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 9px 20px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        .form-cadastro button:hover { background: #1a5fbb; }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <div class="page-shell">
        <a href="../index.html" class="btn-voltar">← Voltar</a>
        <div class="page-header">
            <h1 id="titulo-curso"></h1>
        </div>

        <!-- Formulário de cadastro de professor -->
        <div class="form-cadastro">
            <h2>➕ Cadastrar novo professor</h2>
            <input type="number" id="reg-professor" placeholder="Registro do professor" />
            <input type="text"   id="nome-professor"  placeholder="Nome completo" />
            <input type="email"  id="email-professor" placeholder="E-mail" />
            <input type="password" id="senha-professor" placeholder="Senha provisória" />
            <button onclick="cadastrarProfessor()">Cadastrar</button>
        </div>

        <!-- Lista de professores já cadastrados no banco -->
        <p class="section-title">Professores cadastrados</p>
        <main id="lista-professores-cadastrados" class="grid-professor"></main>

        <!-- Lista estática por curso (comportamento original) -->
        <p class="section-title" style="margin-top:32px;">Professores do curso</p>
        <main id="lista-professores" class="grid-professor"></main>
    </div>

    <script src="../../script.js"></script>
</body>

</html>
