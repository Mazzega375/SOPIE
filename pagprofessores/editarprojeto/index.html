<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPIE - Editar Projeto</title>
    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <a href="../../pagprofessores/index.html" class="btn-voltar">← Voltar</a>

    <h1>Editar Projeto</h1>
    <br>

    <div class="campo">
        <label for="nomprojeto">Nome do Projeto</label>
        <input type="text" id="nomprojeto" placeholder="Digite o nome do projeto">
    </div>

    <div class="campo">
        <label for="lidergrupo"></label>
        <input type="text" id="lidergrupo" placeholder="Líder do Grupo">
    </div>

    <div class="campo">
        <label for="grupo"></label>
        <input type="text" id="grupo" placeholder="Grupo">
    </div>

    <div class="campo">
        <label for="orientador"></label>
        <input type="text" id="orientador" placeholder="Orientador">
    </div>

    <div class="campo" style="margin-top: 12px;">
        <textarea id="descproj" placeholder="Descrição do projeto"></textarea>
    </div>

    <div class="campo">
        <label for="professores">Professores</label>
        <select id="professores">
            <option value="">Selecione...</option>
        </select>
    </div>

    <br>
    <button type="button" onclick="salvareditar()">Salvar</button>

    <br>

    <br>
    <button type="button" onclick="excluirprojeto()" style="color:#ff0000;">Excluir</button>

    <script src="../../script.js"></script>
</body>

</html>
