<!DOCTYPE html>

    <title>SOPIE - Adicionar Projeto</title>
    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <a href="../../pagprofessores/index.html" class="btn-voltar">← Voltar</a>

    <h1>Adicionar Projeto</h1>

    <div class="campo">
        <label for="nomprojeto"></label>
        <input type="text" id="nomprojeto" placeholder="Nome do Projeto">

    <div class="campo">
        <label for="descproj"></label>
        <input type="text" id="descproj" placeholder="Descrição do projeto">

    <br>
    <button type="button" onclick="criarprojeto()">Criar Projeto</button>

    <script src="../../script.js"></script>
